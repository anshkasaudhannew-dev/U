<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="55%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="256" y1="350" x2="256" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <filter id="shadow" x="15%" y="10%" width="70%" height="80%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#713F12" flood-opacity="0.28" />
    </filter>
  </defs>
  <!-- Android Adaptive Squircle Icon Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="102" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" />
  
  <!-- Subtle Orbit Ring -->
  <ellipse cx="256" cy="264" rx="176" ry="68" transform="rotate(-24 256 264)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Rocket Group -->
  <g filter="url(#shadow)">
    <!-- Thrust Flame -->
    <path d="M220 356C220 356 234 446 256 462C278 446 292 356 292 356H220Z" fill="url(#flameGrad)" />
    <!-- Left & Right Fins -->
    <path d="M188 268L136 334C131 340 135 350 143 350H198L188 268Z" fill="#FEF08A" />
    <path d="M324 268L376 334C381 340 377 350 369 350H314L324 268Z" fill="#FEF08A" />
    <!-- Main Pure White Rocket Body -->
    <path d="M256 68C202 122 180 210 186 332C187 343 196 352 207 352H305C316 352 325 343 326 332C332 210 310 122 256 68Z" fill="#FFFFFF" />
    <!-- Nose Cone Accent -->
    <path d="M256 68C232 92 214 122 203 158H309C298 122 280 92 256 68Z" fill="#FEF08A" />
    <!-- Rocket Window Outer Ring -->
    <circle cx="256" cy="224" r="42" fill="#EAB308" />
    <!-- Rocket Window Inner Glass -->
    <circle cx="256" cy="224" r="28" fill="#0F172A" />
    <!-- Window Star Glint -->
    <circle cx="246" cy="214" r="7" fill="#FFFFFF" />
    <!-- Center Fin -->
    <rect x="246" y="302" width="20" height="62" rx="10" fill="#EAB308" />
  </g>
</svg>
